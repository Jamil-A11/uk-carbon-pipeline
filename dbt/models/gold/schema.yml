version: 2

models:
  - name: dim_region
    description: "One row per region, including the 4 aggregates (England, Scotland, Wales, GB). Primary key: region_id."
    columns:
      - name: region_id
        data_tests:
          - not_null
          - unique

  - name: dim_time
    description: "One row per half-hour in September 2026, with UK clock time, day of week and weekend flag. Primary key: from_ts (UTC)."
    columns:
      - name: from_ts
        data_tests:
          - not_null
          - unique

  - name: fact_national_intensity
    description: "One row per half-hour (GB-wide): forecast, actual, forecast error and intensity label. Foreign key: from_ts → dim_time."
    columns:
      - name: from_ts
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_time')
                field: from_ts
