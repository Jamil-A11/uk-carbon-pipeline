version: 2

models:
  - name: silver_national_intensity
    columns:
      - name: from_ts
        data_tests:
          - not_null
          - unique

      - name: to_ts
        data_tests:
          - not_null

      - name: forecast_gco2
        data_tests:
          - not_null

      - name: intensity_index
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['very low', 'low', 'moderate', 'high', 'very high']