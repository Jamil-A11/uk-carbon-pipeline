version: 2

models:
  - name: silver_national_intensity
    description: "Cleaned national carbon intensity for September 2026 (UTC), one row per half-hour, with timestamps converted from text and columns renamed."
    columns:
      - name: from_ts
        data_tests:
          - not_null
          - unique

      - name: to_ts
        data_tests:
          - not_null

      - name: forecast_gco2
        data_tests:
          - not_null

      - name: intensity_index
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['very low', 'low', 'moderate', 'high', 'very high']

  - name: silver_regional_intensity
    description: "Cleaned regional carbon intensity forecasts for September 2026 (UTC), one row per region per half-hour, with boundary duplicates removed and aggregate rows (England, Scotland, Wales, GB) flagged by is_aggregate."
    data_tests:
      - unique:
          arguments:
            column_name: "concat(region_id, '-', from_ts)"
    columns:
      - name: from_ts
        data_tests:
          - not_null
      - name: region_id
        data_tests:
          - not_null
      - name: is_aggregate
        data_tests:
          - not_null

  - name: silver_regional_generation_mix
    description: "Generation mix unpacked from silver_regional_intensity, one row per fuel per region per half-hour, giving each fuel's percentage share of generation."
    data_tests:
      - unique:
          arguments:
            column_name: "concat(region_id, '-', from_ts, '-', fuel)"
    columns:
      - name: fuel
        data_tests:
          - not_null
      - name: generation_pct
        data_tests:
          - not_null