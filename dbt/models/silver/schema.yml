version: 2

models:
  - name: silver_national_intensity
    columns:
      - name: from_ts
        data_tests:
          - not_null
          - unique

      - name: to_ts
        data_tests:
          - not_null

      - name: forecast_gco2
        data_tests:
          - not_null

      - name: intensity_index
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['very low', 'low', 'moderate', 'high', 'very high']

  - name: silver_regional_intensity
    data_tests:
      - unique:
          arguments:
            column_name: "concat(region_id, '-', from_ts)"
    columns:
      - name: from_ts
        data_tests:
          - not_null
      - name: region_id
        data_tests:
          - not_null
      - name: is_aggregate          # ← NEW
        data_tests:
          - not_null

  - name: silver_regional_generation_mix
    data_tests:
      - unique:
          arguments:
            column_name: "concat(region_id, '-', from_ts, '-', fuel)"
    columns:
      - name: fuel
        data_tests:
          - not_null
      - name: generation_pct
        data_tests:
          - not_null